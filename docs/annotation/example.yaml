# A worked example, NOT part of the dataset: a made-up one-day Paris itinerary, fully
# annotated. Times and travel minutes are illustrative. Its text is example.md. Guide:
# docs/ANNOTATION.md.
id: example-paris
city: paris
split: dev
source: claude
model: Claude (example)
prompt: Plan one day in Paris on Tuesday 8 December 2026 with times. I'm staying at Hôtel Regina.
trip_start: 2026-12-08 # a Tuesday
preferences:
  pace: moderate
  max_walk_km: 10
  transport_modes: [walk, transit]

hotel: paris-regina # from the prompt; its red flags in hotels.yaml are gold labels too

# --- gold ---
drafted_by: human
verified_by_human: true
# Place and time copied as written. travel_time names the place travelled to (and the one
# left, as from_place); public_holidays and daily_load name only a day.
violations:
  - check: opening_hours
    day: 1
    place: Louvre Museum
    time: 9:00 – 12:00
    severity: blocker
    evidence: The Louvre is closed every Tuesday.
    source: louvre.fr visitor information
    confidence: verified
  - check: travel_time
    day: 1
    place: Musée d'Orsay
    from_place: Café Marly
    time: 13:45 – 16:00
    severity: warning
    evidence: 15 minutes from lunch to the Orsay, and the walk takes 15. It fits, with no slack.
    source: Google Maps (illustrative)
    confidence: verified
  - check: travel_time
    day: 1
    place: Eiffel Tower
    from_place: Musée d'Orsay
    time: 16:10 – 17:30
    severity: blocker
    evidence: 10 minutes between the Orsay and the Eiffel Tower; the metro takes 25.
    source: Google Maps (illustrative)
    confidence: verified
# No public_holidays label: 8 December isn't a holiday in France.
# No daily_load label: three venues and two meals is fine at a moderate pace.
unknowns:
  - check: opening_hours
    day: 1
    place: Bateaux Parisiens
    reason: Only "Evening", so which sailing they'd take can't be told.
other_issues:
  - The Eiffel Tower summit usually needs a timed ticket booked well ahead.

# --- dev only, for parser debugging (frozen rules) ---
stops:
  - id: s1
    day: 1
    start_time: "08:30"
    end_time: "08:45"
    place_name: Hôtel Regina
    type: hotel
    hotel: paris-regina
  - id: s2
    day: 1
    start_time: "09:00"
    end_time: "12:00"
    place_name: Louvre Museum
    type: venue
  - id: s3
    day: 1
    start_time: "12:15"
    end_time: "13:30"
    place_name: Café Marly
    type: meal
  - id: s4
    day: 1
    start_time: "13:45"
    end_time: "16:00"
    place_name: Musée d'Orsay
    type: venue
  - id: s5
    day: 1
    start_time: "16:10"
    end_time: "17:30"
    place_name: Eiffel Tower
    type: venue
    osm: way/5013364
  - id: s6
    day: 1
    time_of_day: evening
    place_name: Bateaux Parisiens
    type: meal
legs:
  - { from: s1, to: s2, mode: walk, minutes: 5, source: Google Maps (illustrative) }
  - { from: s2, to: s3, mode: walk, minutes: 3, source: Google Maps (illustrative) }
  - { from: s3, to: s4, mode: walk, minutes: 15, source: Google Maps (illustrative) }
  - { from: s4, to: s5, mode: transit, minutes: 25, source: Google Maps (illustrative) }
notes: Bateaux Parisiens has no time, so its leg from the Eiffel Tower isn't recorded.
