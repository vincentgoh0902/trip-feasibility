[project]
name = "trip-feasibility"
version = "0.1.0"
description = "Trip Feasibility Checker backend: API, agent and MCP check tools"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.3.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.161.1",
    "httpx>=0.28.1",
    "langfuse>=5.0.4",
    "langgraph>=1.2.17",
    "mcp>=2.3.0",
    "opening-hours-py>=2.1.4",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.2",
]
embed = [
    "numpy>=2.5.4",
    "sentence-transformers>=5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.ruff.lint.isort]
# backend/alembic/ is the migrations folder, not the package
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
